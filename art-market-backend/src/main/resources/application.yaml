spring:
  application:
    name: artmarket

  datasource:
    # ค่าเชื่อมต่อฐานข้อมูลอ่านจาก environment variable ก่อน ถ้าไม่ตั้งไว้ใช้ค่าหลัง ':' เป็นค่าเริ่มต้น
    # ย้ายเครื่อง/เปลี่ยนรหัส MySQL แล้วไม่ต้องแก้ไฟล์นี้ เช่น  set DB_PASSWORD=mypassword  ก่อนสั่งรัน
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:artandcopyright_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}

# หมายเหตุ: เอา top-level "jwt:" อันเก่าออกแล้ว เหลือแค่ "app.jwt" อันเดียว
# เพราะ JwtUtil.java อ่านจาก ${app.jwt.secret} / ${app.jwt.expiration-ms} เท่านั้น
# การมี 2 ชุดพร้อมกันไม่ได้ทำให้ error แต่ทำให้งงว่าอันไหนถูกใช้จริง เลยตัดออก
app:
  jwt:
    secret: artmarket-maejo-super-secret-key-change-this-in-production-min-256bit
    expiration-ms: 86400000   # 24 ชั่วโมง

  # ตั้งค่าบัญชี Admin เริ่มต้น (สร้างอัตโนมัติตอนแอปสตาร์ทครั้งแรก โดย DataSeeder.java)
  # จุดนี้เคยหายไปจากไฟล์ที่อัปโหลดมา เป็นสาเหตุหนึ่งที่ทำให้สับสนว่า config ตรงไหนที่ควบคุมการสร้าง Admin
  # (ตัว DataSeeder มี default ในตัวอยู่แล้วถ้าไม่ใส่ส่วนนี้ แต่ใส่ไว้ให้เห็นชัดเจนกว่า)
  # origin ของ frontend ที่อนุญาตให้เรียก API ข้ามพอร์ตได้ (คั่นหลายค่าด้วย ,)
  # ถ้าไม่มีส่วนนี้ เบราว์เซอร์จะบล็อกทุก request จาก Next.js ด้วย CORS error
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

  # ยืนยันการจัดส่งสำเร็จอัตโนมัติ — ชิ้นที่จัดส่งแล้ว (มีเลขพัสดุ) แต่ผู้ซื้อไม่กดยืนยันเอง
  # จะถูกปิดเป็น "จัดส่งสำเร็จ" เมื่อครบ auto-confirm-days วันหลังผู้ดูแลระบบยืนยันการชำระเงิน
  delivery:
    auto-confirm-days: 14
    auto-confirm-check-ms: 3600000   # ตรวจทุก 1 ชั่วโมง (และตอนแอปสตาร์ท)

  seed-admin:
    enabled: true
    username: admin
    password: Admin1234!

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.tool.schema: debug