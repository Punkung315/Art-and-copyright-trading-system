spring:
  application:
    name: artmarket

  datasource:
    url: jdbc:mysql://localhost:3306/artmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# JWT config (เลือกใช้ชุดใดชุดหนึ่งให้ตรงกับโค้ด)
jwt:
  secret: artmarket-super-secret-key-maejo-university-2026-change-this-in-production
  expiration-ms: 86400000   # 24 ชั่วโมง

# หรือถ้าโค้ดอ่านจาก app.jwt ให้ใช้ชุดนี้แทน
app:
  jwt:
    secret: artmarket-maejo-super-secret-key-change-this-in-production-min-256bit
    expiration-ms: 86400000

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.tool.schema: debug